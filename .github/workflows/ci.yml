on: [push, pull_request]
name: CI
jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Copy files from repo
        uses: actions/checkout@v6
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry config virtualenvs.create false
          poetry install
      - name: Lint Python
        run: poetry run task lint
      - name: Run Radon
        run: poetry run task radon
      - name: Lint Make
        run: |
          pip install mbake
          mbake format --check Makefile
  security:
    name: Code Security
    runs-on: ubuntu-latest
    steps:
      - name: Copy files from repo
        uses: actions/checkout@v6
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry config virtualenvs.create false
          poetry install
      - name: Run Bandit
        run: poetry run task bandit
